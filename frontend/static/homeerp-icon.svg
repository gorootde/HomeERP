<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- house -->
  <path d="M50 20 L79 46 L79 76 Q79 79 76 79 L24 79 Q21 79 21 76 L21 46 Z"
        fill="#FFFFFF"/>

  <!-- roof ridge accent -->
  <path d="M50 20 L79 46 L72 46 L50 27 L28 46 L21 46 Z" fill="#EEF0FF"/>

  <!-- package / box cut out of the house -->
  <g transform="translate(50,60)">
    <rect x="-15" y="-11" width="30" height="22" rx="2.5" fill="url(#bg)"/>
    <path d="M-15 -3 L15 -3 M0 -11 L0 11" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M-15 -11 L0 -3 L15 -11" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
