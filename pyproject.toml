[tool.poetry]
name = "homeerp"
version = "0.1.0"
description = "Home stock management"
authors = []
packages = [{include = "backend"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.111"
uvicorn = {extras = ["standard"], version = ">=0.29"}
sqlalchemy = ">=2.0"
pydantic = ">=2.7"
python-multipart = ">=0.0.9"
alembic = ">=1.13"
httpx = ">=0.27"
pillow = "^12.3.0"
qrcode = "^8.2"
pyipp = "^0.17.2"
brother-ql = "^0.9.4"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
respx = ">=0.21"
ruff = ">=0.16"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning:pyipp.*",
    "ignore:No path_separator found in configuration:DeprecationWarning",
]

[tool.ruff]
# Alembic-generated revision files follow its own boilerplate import order;
# linting them would fight the code generator on every new migration.
extend-exclude = ["migrations"]

[tool.ruff.lint]
# Baseline: real bugs (pyflakes), broken syntax/formatting (pycodestyle
# errors), import hygiene (isort) — deliberately not the full default rule
# set (e.g. no B008, which flags FastAPI's idiomatic `Depends(...)` default
# args, and no stylistic-only rules like line-length or Optional-vs-`| None`).
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
