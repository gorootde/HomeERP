services:
  homeerp:
    # Use the prebuilt image published by CI on every push to main.
    image: ghcr.io/gorootde/homeerp:latest
    # To build locally instead, comment out `image:` above and uncomment:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: homeerp
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # SQLAlchemy database URL. Default points at the SQLite file on the /data volume.
      DATABASE_URL: sqlite:////data/homeerp.db
      # Directory for user-uploaded product images.
      UPLOADS_DIR: /app/uploads
    volumes:
      - homeerp-data:/data
      - homeerp-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  homeerp-data:
  homeerp-uploads:
